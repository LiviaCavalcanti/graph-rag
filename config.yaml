data:
  # CVEfixes is now the primary dataset for ingestion and graph generation
  active: [cvefixes_file]
  # AutoPatch dataset config. NOTE: patching (--mode batch/full) ALWAYS uses this
  # dataset (independent of `active` above) since db_entry.json fields like
  # root_cause/fix_list are AutoPatch-specific and required by the prompt
  # builder. Override the root via --cve-root or PatchingExperiment(cve_root=...).
  autopatch:
    root: CVE-list
    graphml_root: graphml_cvefixes_files
    include_variants: true
  # CVEfixes dataset configuration
  # Source: https://zenodo.org/record/4476563 (DOI: 10.5281/zenodo.4476563)
  # After downloading: gzcat CVEfixes.sql.gz | sqlite3 data/cvefixes/CVEfixes.db
  cvefixes:
    db_path: data/cvefixes/CVEfixes.db
    graphml_root: graphml_fixedcves_file
    languages: [C, C++]
    level: method
    max_lines: 500
    sample_limit: 0
    # Optional: filter to specific CWEs (empty = load all CWEs)
    # Common choices: [CWE-20, CWE-476, CWE-362, CWE-416, CWE-787, CWE-400, CWE-190]
    target_cwes: [CWE-20, CWE-476, CWE-362, CWE-416, CWE-787, CWE-400, CWE-190]
    # Pinned entries subset used by default for `main.py --mode query` (and
    # therefore `--mode batch`/`full`), instead of streaming the whole DB.
    # Matches cvefixes_experiments/scripts/performance/exp_method_vs_file_level.py.
    # Override with --input-file <path>, or bypass with --full-dataset.
    input_file: experiments_cves/selected_entries.json
  # File-based CVEfixes variant: loads FunctionPairs from a pinned JSON
  # entries file (src.data.entries_cache) instead of streaming the whole DB,
  # with optional CVE-aware CWE resampling. Set `data.active: [cvefixes_file]`
  # to use this for --mode query/full/experiment/diagnostics instead of the
  # full DB (export/index still need the `cvefixes` dataset above for bulk
  # CPG generation over the whole corpus).
  cvefixes_file:
    input_file: experiments_cves/selected_entries.json
    # original: keep the file's pairs unchanged (default).
    # proportional: CVE-aware resample preserving natural CWE proportions.
    # balanced: CVE-aware resample capping every CWE to the same quota.
    sample_mode: original
    sample_total: null
    seed: 42
    min_cves_per_cwe: 1
joern:
  workers: 8
  timeout_s: 120
  bin_dir: /home/z0050s2b/bin/joern/joern-cli
graph:
  # ── program-slice / semantic-diff parameters (compute_graph_diff) ──
  # Control G_vuln construction; tune these to run slicing experiments.
  # Defaults below match the historical hard-coded behavior.
  slice_depth: 3              # hops along CFG/CDG/REACHING_DEF edges from changed nodes
  # change_weight:            # per-diff-label node weights (defaults shown)
  #   removed: 1.0
  #   fix_adjacent: 0.8
  #   edge_changed: 0.6
  #   context: 0.2
  # noise_types: [TYPE_DECL, FILE, NAMESPACE_BLOCK, COMMENT, UNKNOWN, METHOD_RETURN]
  node_types:
    - METHOD
    - METHOD_PARAMETER_IN
    - METHOD_PARAMETER_OUT
    - METHOD_RETURN
    - BLOCK
    - LOCAL
    - CALL
    - IDENTIFIER
    - LITERAL
    - RETURN
    - CONTROL_STRUCTURE
    - FIELD_IDENTIFIER
    - UNKNOWN
  edge_types:
    - AST
    - CFG
    - CDG
    - REF
    - ARGUMENT
    - RECEIVER
embeddings:
  active: [gin, combined, wl, codebert_pattern, codebert_seq]
  dim: 128
  projection: pca              # pca | none
  l2_normalize: true            # true | false
  netlsd:
    timescales: 128
  wl:
    num_iterations: 4
    hidden_dim: 64
  gin:
    hidden_dim: 128
    num_layers: 3
    seed: 42
  rgcn:
    hidden_dim: 128
    num_layers: 3
    seed: 42
  codebert:
    model_path: /home/z0050s2b/code/graph-rag/models/codebert-base/
    dim: 128
    seed: 42
  gin_codebert:
    hidden_dim: 25
    num_layers: 3
    dropout: 0.3
    device: gpu
    cb_batch_size: 32
    node_cache_dir: workspace/node_codebert_cache
    checkpoint_path: experiments/output/gin_codebert_training/gin_codebert_checkpoint.pt
    training:
      lr: 0.001
      weight_decay: 0.0001
      margin: 0.3
      epochs: 50
      batch_size: 16
      triplets_per_epoch: 256
      patience: 10
      mine_every: 5
  gin_struct:
    hidden_dim: 128
    num_layers: 3
    dropout: 0.2
    device: cpu
    checkpoint_path: experiments/output/gin_struct_training/gin_struct_checkpoint.pt
    training:
      lr: 0.00001
      weight_decay: 0.0001
      margin: 0.3
      epochs: 100
      batch_size: 32
      triplets_per_epoch: 512
      patience: 20
      mine_every: 5
      label_mode: cve           # cve or dir_name
      warm_start: true
rag:
  index_path: rag/cvefixes/faiss.index
  metadata_path: rag/cvefixes/metadata.json
  top_k: 5
  embedding_variant: codebert_pattern
  prompt_variant: graph       # default | graph
agents:
  # Patching-agent architecture. Registered names live in src/agents/registry.py.
  # Phase 1 ships `single_turn`; later phases add `multistep`, `tool_using`, `mcp`.
  # Vary this (and prompt_variant) as an experiment axis via PatchingExperiment.
  architecture: single_turn
  # Prompt variant from src/agents/prompts/registry.yaml
  # (default | default_v2 | graph | graph_v2). Kept as `default` to preserve the
  # historical `--mode batch` behaviour; set to `graph` (or pass
  # `--prompt-variant graph`) to patch with serialized G_vuln context.
  prompt_variant: default
  model: null                 # LLM deployment; null → MODEL_NAME from .env
  temperature: 0.2
  max_tokens: 4096
  # ── knobs reserved for later phases (harmless defaults now) ──
  max_tool_iters: 6           # tool-using agent loop bound (Phase 3+)
  tools:
    provider: none            # none | in_process | joern_server
  multistep: {}               # multi-step recipe config (Phase 2+)
experiment:
  split:
    enabled: true
    stratified: true
    seed: 42
    test_ratio: 0.2
    include_real_in_index: true
    augmented_train_ratio: 0.5
    query_source: graphml_augmented
    # Optional: path to a previously-generated split_info.json (its
    # index_entries/query_entries, matched by cve_id+func_name) to reproduce
    # an exact baseline index/query partition instead of resampling. Falls
    # back to the stratified/random split above if unset or unreadable.
    anchor_split_path: null
  # Pipeline verification experiment configuration
  pipeline_verification:
    seed: 42
    slice_depth: 2
    # Target CWEs for retrieval evaluation (CWEs with multi-function CVEs)
    target_cwes:
      - CWE-20              # Improper Input Validation
      - CWE-476             # NULL Pointer Dereference
      - CWE-362             # Race Condition
      - CWE-416             # Use After Free
      - CWE-787             # Out-of-bounds Write
      - CWE-400             # Uncontrolled Resource Consumption
      - CWE-190             # Integer Overflow or Wraparound
    # Sampling and filtering
    samples_per_cwe: 20     # Target entries per CWE → ~140 total
    min_lines: 10           # Minimum function lines
    max_lines: null         # Maximum function lines (null = unlimited)
    # Embedders to evaluate
    embedders:
      - wl
      - combined
      - codebert_seq
    # Retrieval metrics thresholds
    ks: [1, 5, 10]          # Recall cutoffs for hit@k metrics
    success_criteria:
      mrr_threshold: 0.2           # Mean Reciprocal Rank (same-CVE)
      cwe_recall_threshold: 0.5    # CWE-level recall
      hit_at_5_threshold: 0.3      # Hit@5 (same-CVE)
